# Content negotiation per le schede prodotto: un agente che chiede esplicitamente
# application/ld+json riceve il JSON-LD puro (file .jsonld generato da generate-agent-feed.js),
# un browser riceve la pagina HTML prerenderizzata di sempre. Stessa risorsa, due involucri —
# è la sintassi GS1 Digital Link a restare l'unico indirizzo del prodotto.
map $http_accept $wants_jsonld {
    default                   0;
    "~*application/ld\+json"  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le pagine sono pensate per essere lette e parsate da agenti AI: niente
    # compressione "furba", solo gzip standard e charset esplicito.
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml text/html application/ld+json;

    # nginx serve dietro Traefik: l'IP reale del client arriva negli header X-Forwarded-*.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # .jsonld non è nei mime.types di nginx e va dichiarato qui (.wasm invece c'è già).
    types {
        application/ld+json  jsonld;
    }
    include /etc/nginx/mime.types;

    # Healthcheck del compose: non deve dipendere dal contenuto dell'app.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Feed leggero del catalogo, letto all'avvio dal business-agent (store.py → GET /catalog).
    # In Angular non esiste una pagina /catalog (solo /catalog/:sector), quindi il path è libero
    # e qui diventa l'endpoint macchina: elenco dei prodotti senza la ricchezza GS1, che l'agente
    # recupera poi scheda per scheda.
    location = /catalog {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files /catalog.json =404;
    }

    # Asset con hash nel nome (outputHashing: all) → cache lunga e immutabile.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Schede prodotto GS1 Digital Link. Con Accept: application/ld+json la richiesta viene
    # dirottata sul sidecar .jsonld: se il prodotto non pubblica dati strutturati (i demo
    # "non ancora AI Ready", senza rawGs1Data) il file non esiste e la risposta è 404 — così
    # l'agente sa di non avere dati, invece di ricevere una pagina HTML da interpretare.
    location /01/ {
        if ($wants_jsonld) {
            rewrite ^(.*?)/?$ $1/index.jsonld last;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html $uri/ /index.csr.html;
    }

    location ~ \.jsonld$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 1. file esatto (es. /sitemap.xml, /llms.txt)
    # 2. <path>.html          → prerender "piatto"
    # 3. <path>/index.html    → è così che scrive questa build (catalog/fmcg/index.html)
    # 4. fallback sulla shell client-side per le rotte non prerenderizzate (lotto/seriale
    #    arbitrari, vedi app.routes.server.ts): index.csr.html è la shell senza contenuto
    #    prerenderizzato che Angular genera proprio per RenderMode.Client — sostituisce il
    #    trucco del 404.html usato su GitHub Pages, senza servire l'HTML della home su URL
    #    che home non sono.
    location / {
        # L'HTML prerenderizzato cambia a ogni deploy: niente cache.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html $uri/ /index.csr.html;
    }
}
