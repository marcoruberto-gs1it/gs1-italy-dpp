# Content negotiation per le schede prodotto: un agente che chiede esplicitamente
# application/ld+json riceve il JSON-LD puro (file .jsonld generato da generate-jsonld-sidecars.js),
# un browser riceve la pagina HTML prerenderizzata di sempre. Stessa risorsa, due involucri —
# è la sintassi GS1 Digital Link a restare l'unico indirizzo del prodotto.
map $http_accept $wants_jsonld {
    default                   0;
    "~*application/ld\+json"  1;
}

# Terza rappresentazione, il linkset GS1 Digital Link (RFC 9264, vedi ref.gs1.org/standards/
# resolver e jsonld.ts#dppToLinkset per cosa contiene): un resolver GS1 conforme deve offrirlo
# oltre a HTML e JSON-LD, su richiesta esplicita — Accept: application/linkset+json QUI, o il
# parametro ?linkType=... più sotto (linkType=linkset per il linkset stesso, linkType=masterData
# come scorciatoia diretta al JSON-LD invece di dover rimandare l'header Accept).
map $http_accept $wants_linkset {
    default                        0;
    "~*application/linkset\+json"  1;
}
map $arg_linkType $wants_linkset_qs {
    default   0;
    linkset   1;
}
map $arg_linkType $wants_jsonld_qs {
    default      0;
    masterData   1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le pagine sono pensate per essere lette e parsate da agenti AI: niente
    # compressione "furba", solo gzip standard e charset esplicito.
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml text/html application/ld+json;

    # nginx serve dietro Traefik: l'IP reale del client arriva negli header X-Forwarded-*.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # .jsonld/.linkset non sono nei mime.types di nginx e vanno dichiarati qui (.wasm invece
    # c'è già). Estensione "linkset" senza ".json" finale di proposito: nginx sceglie il
    # Content-Type dalla SOLA ultima estensione dell'URI — un file "index.linkset.json"
    # avrebbe preso lo stesso application/json già mappato per .json in mime.types, non lo
    # specifico application/linkset+json richiesto dallo standard (vedi jsonld.ts#dppToLinkset).
    types {
        application/ld+json       jsonld;
        application/linkset+json  linkset;
    }
    include /etc/nginx/mime.types;

    # Healthcheck del compose: non deve dipendere dal contenuto dell'app.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Asset con hash nel nome (outputHashing: all) → cache lunga e immutabile.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Schede prodotto. Con Accept: application/ld+json la richiesta viene dirottata sul sidecar
    # .jsonld: se il prodotto non pubblica dati strutturati il file non esiste e la risposta è
    # 404 — così l'agente sa di non avere dati, invece di ricevere una pagina HTML da interpretare.
    #
    # Qui, e solo qui, il fallback su index.csr.html resta a 200: sotto /01/ vivono le uniche
    # rotte davvero client-side del sito (lotto e seriale arbitrari, RenderMode.Client in
    # app.routes.server.ts), che sono URL legittimi anche se nessun file li prerenderizza.
    # Il prezzo è che pure un GTIN inesistente risponde 200 — accettato: nessun link e nessuna
    # sitemap ci porta, e distinguere qui un GTIN valido da uno inventato richiederebbe una
    # mappa dei 63 GTIN dentro nginx, rigenerata a ogni build.
    location /01/ {
        # Linkset prima di jsonld: se un chiamante manda entrambi i segnali (raro, ma
        # ?linkType=linkset con Accept: application/ld+json capiterebbe con un client scritto
        # male) vince la richiesta più esplicita delle due, il linkset.
        if ($wants_linkset) {
            rewrite ^(.*?)/?$ $1/index.linkset last;
        }
        if ($wants_linkset_qs) {
            rewrite ^(.*?)/?$ $1/index.linkset last;
        }
        if ($wants_jsonld) {
            rewrite ^(.*?)/?$ $1/index.jsonld last;
        }
        if ($wants_jsonld_qs) {
            rewrite ^(.*?)/?$ $1/index.jsonld last;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html $uri/ /index.csr.html;
    }

    # Se non esiste un sidecar JSON-LD statico (generato a build time solo per i prodotti di
    # products.json), prova il JSON-LD vero di una scheda DPP pubblicata (registry-api/src/
    # jsonld.ts — GS1 Web Vocabulary, termini verificati contro ref.gs1.org/voc, vedi
    # docs/GS1-STANDARDS.md). Se nemmeno quella esiste, resta un 404 vero: è il segnale corretto
    # per un agente che ha chiesto esplicitamente dati strutturati e non ce ne sono — vedi il
    # commento sul 200 "accettato" qui sopra, che vale solo per l'HTML.
    location ~ ^/01/(?<jsonld_gtin>[^/]+)(?:/\d+/[^/]+)?/index\.jsonld$ {
        add_header Cache-Control "no-cache";
        try_files $uri @dpp_jsonld;
    }

    # Stesso principio del blocco jsonld qui sopra, per il linkset (vedi jsonld.ts#dppToLinkset
    # e la mappa $wants_linkset* in cima al file).
    location ~ ^/01/(?<linkset_gtin>[^/]+)(?:/\d+/[^/]+)?/index\.linkset$ {
        add_header Cache-Control "no-cache";
        try_files $uri @dpp_linkset;
    }

    location @dpp_jsonld {
        proxy_pass ${REGISTRY_API_URL}/registry-api/public/dpp/$jsonld_gtin/jsonld;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # registry-api è un servizio Render separato che, sul piano gratuito, si addormenta
        # dopo un'inattività e può impiegare fino a ~50s per risvegliarsi alla richiesta
        # successiva: senza questo margine nginx userebbe i timeout di default (60s, già
        # sufficienti qui) ma non aspetterebbe un eventuale connect lento durante l'avvio del
        # container — meglio essere espliciti che scoprirlo in produzione (vedi anche
        # withColdStartRetry in registry-api.service.ts, che copre lo stesso caso lato client).
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location @dpp_linkset {
        proxy_pass ${REGISTRY_API_URL}/registry-api/public/dpp/$linkset_gtin/linkset;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stesso margine di @dpp_jsonld qui sopra, stesso motivo (risveglio a freddo di
        # registry-api sul piano gratuito Render).
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # registry-api gira come servizio Docker separato (in locale sulla stessa rete Traefik,
    # in produzione su Render come Web Service a sé) — mai come processo dentro questo
    # container. Da qui il browser vede comunque un solo dominio, senza CORS: esattamente
    # come faceva Traefik quando i due servizi stavano dietro lo stesso router (vedi
    # docker-compose.yml). ${REGISTRY_API_URL} è sostituito a avvio container da
    # /etc/nginx/templates (vedi webshop/Dockerfile) — in locale/Traefik questo blocco non
    # viene mai raggiunto (Traefik instrada /registry-api prima ancora che arrivi qui), il
    # default sotto serve solo da non far fallire la sostituzione del template.
    location /registry-api/ {
        proxy_pass ${REGISTRY_API_URL}/registry-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stesso margine di @dpp_jsonld qui sopra, per lo stesso motivo (risveglio a freddo di
        # registry-api sul piano gratuito Render).
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # Sezione admin (creare/modificare/pubblicare una scheda DPP): RenderMode.Client in
    # app.routes.server.ts, quindi nessun file prerenderizzato — stesso fallback di /01/ sopra.
    # noindex perché è un'area riservata (password in registry-api/src/auth.ts), non un
    # contenuto da far leggere a motori di ricerca o agenti AI.
    location /admin {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri.html $uri/ /index.csr.html;
    }

    # 1. file esatto (es. /sitemap.xml, /llms.txt)
    # 2. <path>.html          → prerender "piatto"
    # 3. <path>/index.html    → è così che scrive questa build (catalog/fmcg/index.html)
    # 4. niente di tutto questo → 404 VERO.
    #
    # Fuori da /01/ non esistono rotte client-side: ogni pagina di questo sito è
    # prerenderizzata. Il fallback incondizionato su index.csr.html che c'era qui rispondeva
    # quindi 200 a qualunque URL inventato (/pagina-inesistente, /voc/llms.txt che GPTBot
    # chiedeva risolvendo male un link relativo…), cioè un soft 404: per un crawler il sito
    # aveva infinite pagine valide e tutte uguali, il segnale peggiore che si possa dare a chi
    # deve decidere quanto indicizzarci.
    #
    # error_page serve comunque la shell dell'app, ma con lo status 404 (nginx conserva il
    # codice originale se non lo si sovrascrive con "=200"): un umano vede il sito, un bot
    # legge 404. Vale solo qui dentro, così un asset mancante resta un 404 secco senza
    # trascinarsi dietro un HTML inutile.
    location / {
        # L'HTML prerenderizzato cambia a ogni deploy: niente cache.
        add_header Cache-Control "no-cache";
        error_page 404 /index.csr.html;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
}
