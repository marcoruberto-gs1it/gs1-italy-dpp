# Stack di SVILUPPO LOCALE (solo HTTP, nessun certificato) — non usato in produzione: il
# deploy vero gira su Render come due Web Service Docker indipendenti (vedi
# docs/DEPLOY.md), non con questo compose. Qui serve solo a riprodurre in locale lo stesso
# instradamento same-origin che in produzione fa nginx (vedi il blocco `/registry-api` in
# webshop/nginx.conf) tramite Traefik, comodo per non dover configurare CORS neanche in
# sviluppo.
#
#   docker compose up -d --build
#
# Quattro servizi dietro un unico Traefik:
#
#   localhost/             → webshop              nginx con l'Angular prerenderizzato
#   localhost/registry-api → registry-api          CRUD schede DPP + pubblicazione su mock-eu-registry
#   id.localhost/          → resolver-web           GS1 Digital Link Resolver CE — risoluzione conforme allo standard
#   id.localhost/api,/swaggerui → resolver-data-entry  Data Entry API del resolver (vedi resolver/README.md)
#
# id.localhost è un dominio locale distinto (non solo un path) apposta: in produzione un vero
# GS1-Conformant Resolver vive su un sottodominio dedicato (es. id.<dominio>, vedi
# docs/RESOLVER-SETUP.md), non su un path del sito principale — .localhost risolve da solo su
# 127.0.0.1 senza toccare /etc/hosts (RFC 6761), quindi anche in locale si riproduce la stessa
# separazione di dominio vera, non un'approssimazione.
#
# mock-eu-registry (il registro UE, https://github.com/CIRPASS-2/mock-eu-registry) NON è in
# questo file: gira su Render (Postgres su Supabase, OIDC su Auth0) — vedi
# docs/REGISTRY-SETUP.md. registry-api lo chiama via URL pubblica (MOCK_EU_REGISTRY_URL), non
# sulla rete Docker.

services:
  # Traefik locale — unico servizio di questo file con una porta pubblicata sull'host (vedi
  # `ports:` sotto): si accende mettendo `COMPOSE_PROFILES=edge` nel proprio .env (vedi
  # .env.example). Senza, webshop/registry-api restano irraggiungibili da fuori Docker — per
  # sviluppare senza Docker si usa invece `npm start` + `registry-api/npm run dev` (vedi
  # README.md), che non passano da qui.
  traefik:
    profiles: ["edge"]
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=catalogosmart-web
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Traefik legge le label dei container per configurarsi da solo: gli serve il socket
      # Docker in sola lettura.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  # Il sito GS1 DPP: pagine prodotto prerenderizzate con JSON-LD embeddato e la content
  # negotiation su /01/{gtin} (vedi webshop/nginx.conf).
  webshop:
    build:
      # Il context è la root del repo perché il sorgente Angular sta lì.
      context: .
      dockerfile: webshop/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      # 127.0.0.1 e non localhost: il wget di busybox prova prima ::1, dove nginx
      # (listen 80, solo IPv4) non ascolta.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      # Su quale rete Traefik deve raggiungere questo container: lo Traefik di `edge/` è
      # connesso anche alla rete di poc-lab.gs1it.dev e non ha un default globale.
      traefik.docker.network: "catalogosmart-web"
      # Il prefisso `smart-` non è cosmetico: router, servizi e middleware sono nomi
      # globali in Traefik, non per container, e lo stack di poc-lab.gs1it.dev dichiara
      # già `webshop`. Verificato che cosa succede senza prefisso, con due container che
      # dichiarano lo stesso nome di router e regole Host diverse: Traefik non ne sceglie
      # uno e non li bilancia — scarta la configurazione e NESSUNO dei due siti risponde
      # più (404 su entrambi i domini). Nei log:
      #   ERR HTTP router defined multiple times with different configurations
      #       routerName=webshop-tls providerName=docker
      # Il bilanciamento a rotazione avviene solo quando le due configurazioni sono
      # identiche: è il meccanismo con cui funziona `--scale`, ma qui le regole Host
      # differiscono per definizione.
      traefik.http.services.smart-webshop.loadbalancer.server.port: "80"
      # In locale nessun dominio: catch-all su qualsiasi Host (http://localhost).
      # In produzione il router `smart-webshop-tls` con regola Host ha priorità più alta.
      traefik.http.routers.smart-webshop.entrypoints: "web"
      traefik.http.routers.smart-webshop.rule: "PathPrefix(`/`)"
      # Priorità esplicita e bassa (era implicita, calcolata da Traefik dalla lunghezza della
      # regola): senza, mischiare router con priorità esplicita (resolver-*, sotto) e router
      # senza è un comportamento non garantito da Traefik — verificato dal vivo, senza questa
      # riga "PathPrefix(`/`)" a volte intercetta anche le richieste per id.localhost prima che
      # arrivino al resolver.
      traefik.http.routers.smart-webshop.priority: "1"

  # Sezione admin DPP: CRUD delle schede (Postgres Supabase, tabella separata da mock-eu-registry)
  # + pubblicazione su mock-eu-registry (chiamata in uscita, non sulla rete Docker — vedi
  # commento in cima al file).
  registry-api:
    build:
      context: ./registry-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web
    environment:
      SITE_URL: "${SITE_URL:-http://localhost}"
      # Origine del resolver pubblico: è l'IDENTIFICATORE Digital Link (@id, UPI, anchor del
      # linkset), mentre SITE_URL sopra è dove vivono le pagine — vedi registry-api/src/publicUrls.ts.
      RESOLVER_PUBLIC_URL: "${RESOLVER_PUBLIC_URL:-http://id.localhost}"
      # Dati delle schede DPP — vedi docs/REGISTRY-SETUP.md.
      REGISTRY_DATABASE_URL: "${REGISTRY_DATABASE_URL:?REGISTRY_DATABASE_URL non impostata}"
      # Sbarramento a password davanti a /registry-api (vedi registry-api/src/auth.ts).
      # Vuota = accesso libero: in locale si lavora senza login, in produzione si valorizza.
      REGISTRY_ADMIN_PASSWORD: "${REGISTRY_ADMIN_PASSWORD:-}"
      REGISTRY_AUTH_SECRET: "${REGISTRY_AUTH_SECRET:-}"
      # Registro UE (mock-eu-registry su Render + Auth0 M2M) — vedi docs/REGISTRY-SETUP.md.
      # Finché sono vuote, tutto il resto della sezione admin funziona: solo "Pubblica" fallisce
      # con un errore esplicito (vedi registry-api/src/mockRegistryClient.ts).
      MOCK_EU_REGISTRY_URL: "${MOCK_EU_REGISTRY_URL:-}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:-}"
      AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID:-}"
      AUTH0_M2M_CLIENT_SECRET: "${AUTH0_M2M_CLIENT_SECRET:-}"
      AUTH0_M2M_AUDIENCE: "${AUTH0_M2M_AUDIENCE:-}"
      # GS1 Digital Link Resolver CE (vedi resolver/README.md) — indirizzo interno alla rete
      # Docker, niente bisogno di passare da Traefik/id.localhost per una chiamata
      # servizio-a-servizio. Finché RESOLVER_SESSION_TOKEN è vuota, la sincronizzazione è
      # disattivata (stessa filosofia di MOCK_EU_REGISTRY_URL sopra): il resto dell'admin
      # continua a funzionare, vedi registry-api/src/resolverClient.ts.
      # /api: le rotte Flask di data_entry_server vivono native sotto quel prefisso (Blueprint
      # con url_prefix='/api', verificato in resolver/data_entry_server/src/__init__.py) — a
      # differenza di resolver-web, qui non serve nessun middleware Traefik che lo aggiunga.
      RESOLVER_API_URL: "${RESOLVER_API_URL:-http://resolver-data-entry:3000/api}"
      RESOLVER_SESSION_TOKEN: "${RESOLVER_SESSION_TOKEN:-}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "catalogosmart-web"
      # Prefisso `smart-`: vedi il commento sui nomi globali nel webshop qui sopra.
      traefik.http.services.smart-registry-api.loadbalancer.server.port: "4310"
      traefik.http.routers.smart-registry-api.entrypoints: "web"
      traefik.http.routers.smart-registry-api.rule: "PathPrefix(`/registry-api`)"
      # Priorità esplicita: vedi il commento su smart-webshop.priority più sopra.
      traefik.http.routers.smart-registry-api.priority: "5"

  # --- GS1 Digital Link Resolver CE (vedi resolver/README.md) ---------------------------------
  # Vendorizzato da gs1/GS1_DigitalLink_Resolver_CE, non un fork: nessuna modifica al codice
  # sorgente Python, solo questa orchestrazione (la loro frontend_proxy_server/nginx non serve,
  # Traefik già ricopre lo stesso ruolo nel resto di questo file).
  resolver-database:
    build: ./resolver/database_server
    restart: unless-stopped
    networks:
      - web
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${RESOLVER_MONGO_USER:-gs1resolver}"
      MONGO_INITDB_ROOT_PASSWORD: "${RESOLVER_MONGO_PASSWORD:-gs1resolver}"
    volumes:
      - resolver-database-volume:/data/db

  resolver-data-entry:
    build: ./resolver/data_entry_server
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - resolver-database
    environment:
      MONGO_URI: "${RESOLVER_MONGO_URI:-mongodb://gs1resolver:gs1resolver@resolver-database:27017}"
      SESSION_TOKEN: "${RESOLVER_SESSION_TOKEN:-devtoken}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "catalogosmart-web"
      traefik.http.services.smart-resolver-data-entry.loadbalancer.server.port: "3000"
      traefik.http.routers.smart-resolver-data-entry.entrypoints: "web"
      # Sotto id.localhost (non un path del sito principale, vedi il commento in cima al file) —
      # priorità esplicita più alta di resolver-web sotto, che sullo stesso Host risponde a
      # tutto il resto: senza, Traefik potrebbe scegliere la regola più corta a parità di altri
      # criteri invece di quella più specifica.
      traefik.http.routers.smart-resolver-data-entry.rule: "Host(`id.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/swaggerui`))"
      traefik.http.routers.smart-resolver-data-entry.priority: "20"

  resolver-web:
    build: ./resolver/web_server
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - resolver-database
    environment:
      MONGO_URI: "${RESOLVER_MONGO_URI:-mongodb://gs1resolver:gs1resolver@resolver-database:27017}"
      # Sovrascrive il default nel loro Dockerfile (vedi resolver/web_server/Dockerfile) — il
      # dominio che questo servizio dichiara di sé nei linkset che genera (usato nudo, SENZA
      # schema: il loro codice antepone da solo "https://" — verificato dal vivo, con lo schema
      # incluso qui si ottiene un doppio prefisso "https://http://..." nel campo "anchor").
      FQDN: "${RESOLVER_FQDN:-id.localhost}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "catalogosmart-web"
      traefik.http.services.smart-resolver-web.loadbalancer.server.port: "4000"
      traefik.http.routers.smart-resolver-web.entrypoints: "web"
      traefik.http.routers.smart-resolver-web.rule: "Host(`id.localhost`)"
      # Le rotte Flask di questo servizio vivono sotto /api al proprio interno (stessa scelta
      # della loro frontend_proxy_server/nginx.conf originale, verificato leggendone la
      # location "/": "proxy_pass http://web-service:4000/api/"): senza aggiungere lo stesso
      # prefisso qui, un GET id.localhost/01/{gtin} arriverebbe come /01/{gtin} nudo e
      # risponderebbe 404, mai raggiungendo web_namespace.py.
      traefik.http.middlewares.smart-resolver-web-api-prefix.addprefix.prefix: "/api"
      traefik.http.routers.smart-resolver-web.middlewares: "smart-resolver-web-api-prefix"
      traefik.http.routers.smart-resolver-web.priority: "10"

volumes:
  # Dati del resolver (Mongo) — persistono tra un `docker compose up` e l'altro, come il resto
  # dei volumi Docker di questo progetto.
  resolver-database-volume: {}

networks:
  web:
    # Nome esplicito: Traefik risolve `--providers.docker.network` sul nome reale della
    # rete Docker, che altrimenti sarebbe prefissato col nome del progetto compose.
    #
    # Rete propria, distinta da quella di poc-lab.gs1it.dev, e non è un vezzo: i nomi di
    # servizio sono uguali nei due stack (webshop, registry-api) e su una rete condivisa
    # esisterebbero due volte nel DNS di Docker. Lo stack `edge/` la dichiara `external`
    # per attaccarvisi; qui resta creata e gestita da compose, così in locale non serve
    # crearla a mano.
    name: catalogosmart-web
