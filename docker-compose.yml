# Stack base — è quello che gira in locale (solo HTTP, nessun certificato).
# In produzione si aggiunge docker-compose.prod.yml, che attiva HTTPS/Let's Encrypt:
#
#   locale:      docker compose up -d --build
#   produzione:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Tre servizi dietro un unico Traefik, tutti sullo stesso dominio (niente CORS):
#
#   /             → webshop         nginx con l'Angular prerenderizzato
#   /registry-api → registry-api    CRUD schede DPP + pubblicazione su mock-eu-registry
#
# mock-eu-registry (il registro UE, https://github.com/CIRPASS-2/mock-eu-registry) NON è in
# questo file: gira su Render (Postgres su Supabase, OIDC su Auth0) — vedi
# docs/REGISTRY-SETUP.md. registry-api lo chiama via URL pubblica (MOCK_EU_REGISTRY_URL), non
# sulla rete Docker.

services:
  # Traefik per l'ambiente locale, dove questo stack è l'unico sulla macchina.
  # In produzione questo sito convive sul droplet con poc-lab.gs1it.dev (branch main,
  # clonato in un'altra directory) e la porta 80 è una: il reverse proxy è lo stack
  # condiviso `edge/`, che sta nel branch main e va avviato una volta sola da lì. Qui il
  # servizio NON deve partire — da cui il profilo. In locale si accende mettendo
  # `COMPOSE_PROFILES=edge` nel proprio .env (vedi .env.example).
  traefik:
    profiles: ["edge"]
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=catalogosmart-web
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Traefik legge le label dei container per configurarsi da solo: gli serve il socket
      # Docker in sola lettura.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  # Il sito GS1 DPP: pagine prodotto prerenderizzate con JSON-LD embeddato e la content
  # negotiation su /01/{gtin} (vedi webshop/nginx.conf).
  webshop:
    build:
      # Il context è la root del repo perché il sorgente Angular sta lì.
      context: .
      dockerfile: webshop/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      # 127.0.0.1 e non localhost: il wget di busybox prova prima ::1, dove nginx
      # (listen 80, solo IPv4) non ascolta.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      # Su quale rete Traefik deve raggiungere questo container: lo Traefik di `edge/` è
      # connesso anche alla rete di poc-lab.gs1it.dev e non ha un default globale.
      traefik.docker.network: "catalogosmart-web"
      # Il prefisso `smart-` non è cosmetico: router, servizi e middleware sono nomi
      # globali in Traefik, non per container, e lo stack di poc-lab.gs1it.dev dichiara
      # già `webshop`. Verificato che cosa succede senza prefisso, con due container che
      # dichiarano lo stesso nome di router e regole Host diverse: Traefik non ne sceglie
      # uno e non li bilancia — scarta la configurazione e NESSUNO dei due siti risponde
      # più (404 su entrambi i domini). Nei log:
      #   ERR HTTP router defined multiple times with different configurations
      #       routerName=webshop-tls providerName=docker
      # Il bilanciamento a rotazione avviene solo quando le due configurazioni sono
      # identiche: è il meccanismo con cui funziona `--scale`, ma qui le regole Host
      # differiscono per definizione.
      traefik.http.services.smart-webshop.loadbalancer.server.port: "80"
      # In locale nessun dominio: catch-all su qualsiasi Host (http://localhost).
      # In produzione il router `smart-webshop-tls` con regola Host ha priorità più alta.
      traefik.http.routers.smart-webshop.entrypoints: "web"
      traefik.http.routers.smart-webshop.rule: "PathPrefix(`/`)"

  # Sezione admin DPP: CRUD delle schede (SQLite locale) + pubblicazione su mock-eu-registry
  # (chiamata in uscita, non sulla rete Docker — vedi commento in cima al file).
  registry-api:
    build:
      context: ./registry-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web
    volumes:
      - registry-api-data:/data
    environment:
      SITE_URL: "${SITE_URL:-http://localhost}"
      # Sbarramento a password davanti a /registry-api (vedi registry-api/src/auth.ts).
      # Vuota = accesso libero: in locale si lavora senza login, in produzione si valorizza.
      REGISTRY_ADMIN_PASSWORD: "${REGISTRY_ADMIN_PASSWORD:-}"
      REGISTRY_AUTH_SECRET: "${REGISTRY_AUTH_SECRET:-}"
      # Registro UE (mock-eu-registry su Render + Auth0 M2M) — vedi docs/REGISTRY-SETUP.md.
      # Finché sono vuote, tutto il resto della sezione admin funziona: solo "Pubblica" fallisce
      # con un errore esplicito (vedi registry-api/src/mockRegistryClient.ts).
      MOCK_EU_REGISTRY_URL: "${MOCK_EU_REGISTRY_URL:-}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:-}"
      AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID:-}"
      AUTH0_M2M_CLIENT_SECRET: "${AUTH0_M2M_CLIENT_SECRET:-}"
      AUTH0_M2M_AUDIENCE: "${AUTH0_M2M_AUDIENCE:-}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "catalogosmart-web"
      # Prefisso `smart-`: vedi il commento sui nomi globali nel webshop qui sopra.
      traefik.http.services.smart-registry-api.loadbalancer.server.port: "4310"
      traefik.http.routers.smart-registry-api.entrypoints: "web"
      traefik.http.routers.smart-registry-api.rule: "PathPrefix(`/registry-api`)"

networks:
  web:
    # Nome esplicito: Traefik risolve `--providers.docker.network` sul nome reale della
    # rete Docker, che altrimenti sarebbe prefissato col nome del progetto compose.
    #
    # Rete propria, distinta da quella di poc-lab.gs1it.dev, e non è un vezzo: i nomi di
    # servizio sono uguali nei due stack (webshop, registry-api) e su una rete condivisa
    # esisterebbero due volte nel DNS di Docker. Lo stack `edge/` la dichiara `external`
    # per attaccarvisi; qui resta creata e gestita da compose, così in locale non serve
    # crearla a mano.
    name: catalogosmart-web

volumes:
  # Le schede DPP (bozze e pubblicate) sopravvivono a un `docker compose down` — solo un
  # `-v` esplicito le cancella.
  registry-api-data:
