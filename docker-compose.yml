# Stack base — è quello che gira in locale (solo HTTP, nessun certificato).
# In produzione si aggiunge docker-compose.prod.yml, che attiva HTTPS/Let's Encrypt:
#
#   locale:      docker compose up -d --build
#   produzione:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Quattro servizi dietro un unico Traefik, tutti sullo stesso dominio (niente CORS):
#
#   /            → webshop         nginx con l'Angular prerenderizzato
#   /catalog     → webshop         feed JSON del catalogo, letto dal business-agent
#   /assistente  → chat-client     la chat React (sample UCP di Google)
#   /api         → chat-client     proxy Vite verso il business-agent
#
# Il business-agent non ha un router Traefik: vive solo sulla rete Docker.

services:
  # Traefik per l'ambiente locale, dove questo stack è l'unico sulla macchina.
  # In produzione questo sito convive sul droplet con poc-lab.gs1it.dev (branch main,
  # clonato in un'altra directory) e la porta 80 è una: il reverse proxy è lo stack
  # condiviso `edge/`, che sta nel branch main e va avviato una volta sola da lì. Qui il
  # servizio NON deve partire — da cui il profilo. In locale si accende mettendo
  # `COMPOSE_PROFILES=edge` nel proprio .env (vedi .env.example).
  traefik:
    profiles: ["edge"]
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=catalogosmart-web
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Traefik legge le label dei container per configurarsi da solo: gli serve il socket
      # Docker in sola lettura.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  # Il sito GS1: pagine prodotto prerenderizzate con JSON-LD embeddato e, per gli agenti,
  # il feed /catalog e la content negotiation su /01/{gtin} (vedi webshop/nginx.conf).
  # È la sorgente dati del business-agent — nel sample di Google quel ruolo lo aveva un
  # finto shop FastAPI, qui lo fa il sito vero.
  webshop:
    build:
      # Il context è la root del repo perché il sorgente Angular sta lì.
      context: .
      dockerfile: webshop/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      # Il business-agent carica il catalogo all'avvio: deve partire a sito servito.
      # 127.0.0.1 e non localhost: il wget di busybox prova prima ::1, dove nginx
      # (listen 80, solo IPv4) non ascolta.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      # Su quale rete Traefik deve raggiungere questo container: lo Traefik di `edge/` è
      # connesso anche alla rete di poc-lab.gs1it.dev e non ha un default globale.
      traefik.docker.network: "catalogosmart-web"
      # Il prefisso `smart-` non è cosmetico: router, servizi e middleware sono nomi
      # globali in Traefik, non per container, e lo stack di poc-lab.gs1it.dev dichiara
      # già `webshop`. Verificato che cosa succede senza prefisso, con due container che
      # dichiarano lo stesso nome di router e regole Host diverse: Traefik non ne sceglie
      # uno e non li bilancia — scarta la configurazione e NESSUNO dei due siti risponde
      # più (404 su entrambi i domini). Nei log:
      #   ERR HTTP router defined multiple times with different configurations
      #       routerName=webshop-tls providerName=docker
      # Il bilanciamento a rotazione avviene solo quando le due configurazioni sono
      # identiche: è il meccanismo con cui funziona `--scale`, ma qui le regole Host
      # differiscono per definizione.
      traefik.http.services.smart-webshop.loadbalancer.server.port: "80"
      # In locale nessun dominio: catch-all su qualsiasi Host (http://localhost).
      # In produzione il router `smart-webshop-tls` con regola Host ha priorità più alta.
      traefik.http.routers.smart-webshop.entrypoints: "web"
      traefik.http.routers.smart-webshop.rule: "PathPrefix(`/`)"

  # Agente commerciale: Google ADK + A2A + UCP, modello Gemini su Vertex AI.
  business-agent:
    build:
      context: ./business-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web
    environment:
      # I due punti di contatto col catalogo: GET /catalog all'avvio (store.py) e
      # GET /01/{gtin} on-demand dal tool leggi_prodotto.
      CATALOG_URL: "http://webshop"
      # ── Vertex AI (usa il billing del progetto GCP, no API key) ──
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT non impostata}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-global}"
      GOOGLE_APPLICATION_CREDENTIALS: "/creds/sa.json"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
      # Diagnostica del context caching (vedi main.py): 1 per vedere hit/miss nei log.
      CACHE_DEBUG: "${CACHE_DEBUG:-0}"
      # 0 disattiva il context caching (vedi agent_executor.py).
      CONTEXT_CACHE: "${CONTEXT_CACHE:-1}"
    volumes:
      - "./secrets/gcp-sa.json:/creds/sa.json:ro"
    depends_on:
      webshop:
        condition: service_healthy

  # UI di chat del sample UCP: dev server Vite, servito sotto /assistente (vedi base in
  # vite.config.ts) e proxy /api verso l'agente.
  chat-client:
    build:
      context: ./chat-client
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web
    environment:
      VITE_PROXY_TARGET: "http://business-agent:10999"
      # Il profilo UCP è scaricato dal business-agent, non dal browser: deve essere un URL
      # risolvibile dentro la rete Docker (per il container dell'agente `localhost` sarebbe
      # sé stesso). Il path include il base di Vite.
      VITE_PROFILE_URL: "http://chat-client:3000/assistente/profile/agent_profile.json"
      # Sbarramento a password davanti a /assistente e /api (vedi chat-client/auth-gate.ts).
      # Vuota = accesso libero: in locale si lavora senza login, in produzione si valorizza.
      CHAT_PASSWORD: "${CHAT_PASSWORD:-}"
      CHAT_AUTH_SECRET: "${CHAT_AUTH_SECRET:-}"
    depends_on:
      - business-agent
    labels:
      traefik.enable: "true"
      # Su quale rete Traefik deve raggiungere questo container: lo Traefik di `edge/` è
      # connesso anche alla rete di poc-lab.gs1it.dev e non ha un default globale.
      traefik.docker.network: "catalogosmart-web"
      # Prefisso `smart-`: vedi il commento sui nomi globali nel webshop qui sopra.
      traefik.http.services.smart-chat-client.loadbalancer.server.port: "3000"
      # Regole più lunghe del catch-all del webshop: Traefik dà loro priorità automatica.
      traefik.http.routers.smart-chat-client.entrypoints: "web"
      traefik.http.routers.smart-chat-client.rule: "PathPrefix(`/assistente`) || PathPrefix(`/api`)"
      traefik.http.routers.smart-chat-client.middlewares: "smart-assistente-trailing-slash"
      # Vite serve l'app solo su /assistente/ (con la barra finale) e non redirige da solo:
      # senza questo, il link "Assistente" del sito finirebbe su un 404. $$ sfugge
      # l'interpolazione di compose, a Traefik arriva ${1}.
      traefik.http.middlewares.smart-assistente-trailing-slash.redirectregex.regex: "^(https?://[^/]+)/assistente$$"
      traefik.http.middlewares.smart-assistente-trailing-slash.redirectregex.replacement: "$${1}/assistente/"

networks:
  web:
    # Nome esplicito: Traefik risolve `--providers.docker.network` sul nome reale della
    # rete Docker, che altrimenti sarebbe prefissato col nome del progetto compose.
    #
    # Rete propria, distinta da quella di poc-lab.gs1it.dev, e non è un vezzo: i nomi di
    # servizio sono uguali nei due stack (webshop, business-agent, chat-client) e su una
    # rete condivisa esisterebbero due volte nel DNS di Docker. `CATALOG_URL: http://webshop`
    # risolverebbe a caso, e l'agente di questo sito finirebbe a leggere il catalogo
    # dell'altro. Lo stack `edge/` la dichiara `external` per attaccarvisi; qui resta
    # creata e gestita da compose, così in locale non serve crearla a mano.
    name: catalogosmart-web
