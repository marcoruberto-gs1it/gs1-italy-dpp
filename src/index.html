<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Catalogo Smart</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="index, follow">
  <!-- Verifica della proprietà per Google Search Console. Sta qui e non nella sola home
       perché questa head è quella di tutte le pagine prerenderizzate: Search Console
       cerca il tag sull'URL che si sta verificando, e averlo ovunque non ha controindicazioni. -->
  <meta name="google-site-verification" content="-JscqRcrLZJCv4eHrHL3hDokBorysvv3EAdLfrBiKII">
  <!-- og:title/og:description/og:image/og:url e i twitter:* corrispondenti sono impostati per
       pagina da ogni componente (vedi src/app/utils/social-meta.ts) — qui solo i tre valori che
       non cambiano mai da una pagina all'altra. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Catalogo Smart">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fraunces (variable, asse opsz) per i titoli — carattere editoriale che rompe col "Plus
       Jakarta Sans ovunque" da SaaS generico: solo i titoli lo usano (vedi --font-display in
       tokens.css), il corpo del testo resta su Plus Jakarta Sans per la leggibilità già verificata. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('gs1-theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch {}
    })();
  </script>
  <!-- Google Analytics 4. Come il meta di Search Console qui sopra, sta nell'head comune:
       vale così per tutte le pagine prerenderizzate senza ripeterlo altrove. Caricato async
       e messo dopo lo script del tema, che deve restare il primo a girare per non far
       lampeggiare la pagina al primo paint. -->
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YXXHX7C04F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YXXHX7C04F');
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
