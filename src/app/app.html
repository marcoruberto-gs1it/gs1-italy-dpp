<header class="site-header">
  <div class="header-container">
    <div class="header-left">
      <a routerLink="/" class="logo" [title]="t('nav.backToHome')" (click)="closeMobileNav()">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2.5l1.85 6.15L20 10.5l-6.15 1.85L12 18.5l-1.85-6.15L4 10.5l6.15-1.85L12 2.5z" fill="url(#logoSpark)"/>
            <defs>
              <linearGradient id="logoSpark" x1="4" y1="2.5" x2="20" y2="18.5" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--brand)"/>
                <stop offset="1" stop-color="var(--brand-accent)"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="logo-text">{{ t('hero.pageTitle') }}</span>
      </a>

      <nav class="header-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ t('nav.home') }}</a>
        <!-- href e non routerLink: /assistente non è più una pagina Angular, è il chat-client
             React servito da Traefik sullo stesso dominio (vedi docker-compose.yml). Serve un
             page load vero, altrimenti il router Angular intercetterebbe il click. -->
        <a href="/assistente">{{ t('nav.assistant') }}</a>
        <button type="button" class="nav-search-trigger" (click)="uiState.openSearch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>{{ t('nav.searchPlaceholder') }}</span>
          <span class="gs-kbd">/</span>
        </button>
      </nav>
    </div>

    <div class="header-actions">
      <div class="lang-switch desktop-only" role="group" [attr.aria-label]="t('nav.languageLabel')">
        <button type="button" [class.active]="languageService.lang() === 'it'" (click)="languageService.setLang('it')" [attr.aria-label]="t('nav.switchToItalian')">IT</button>
        <button type="button" [class.active]="languageService.lang() === 'en'" (click)="languageService.setLang('en')" [attr.aria-label]="t('nav.switchToEnglish')">EN</button>
      </div>

      <!-- Selettore tema: finché non si tocca, il sito segue le impostazioni di sistema;
           al primo clic la scelta diventa esplicita e viene ricordata (ThemeService). -->
      <button
        type="button"
        class="icon-btn theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? t('nav.switchToLight') : t('nav.switchToDark')"
        [title]="themeService.theme() === 'dark' ? t('nav.switchToLight') : t('nav.switchToDark')"
      >
        @if (themeService.theme() === 'dark') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        }
      </button>

      <button type="button" class="icon-btn mobile-search-trigger" (click)="uiState.openSearch()" [attr.aria-label]="t('nav.searchAria')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <button type="button" class="icon-btn mobile-nav-trigger" (click)="toggleMobileNav()" [attr.aria-label]="t('nav.menuAria')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </div>
</header>

@if (mobileNavOpen()) {
  <div class="mobile-nav-backdrop" (click)="closeMobileNav()">
    <aside class="mobile-nav" (click)="$event.stopPropagation()">
      <div class="mobile-nav-header">
        <span>{{ t('hero.pageTitle') }}</span>
        <button type="button" class="icon-btn" (click)="closeMobileNav()" [attr.aria-label]="t('nav.closeMenuAria')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <a routerLink="/" class="mobile-nav-link" (click)="closeMobileNav()">{{ t('nav.home') }}</a>
      <a href="/assistente" class="mobile-nav-link">{{ t('nav.assistant') }}</a>
      <div class="lang-switch mobile-lang-switch" role="group" [attr.aria-label]="t('nav.languageLabel')">
        <button type="button" [class.active]="languageService.lang() === 'it'" (click)="languageService.setLang('it')" [attr.aria-label]="t('nav.switchToItalian')">IT</button>
        <button type="button" [class.active]="languageService.lang() === 'en'" (click)="languageService.setLang('en')" [attr.aria-label]="t('nav.switchToEnglish')">EN</button>
      </div>
    </aside>
  </div>
}

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <div class="footer-container">
    <p class="footer-legal">{{ t('hero.pageTitle') }}</p>
  </div>
</footer>

<app-search-palette></app-search-palette>
