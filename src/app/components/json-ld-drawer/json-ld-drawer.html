@if (isOpen()) {
  <div class="drawer-backdrop" (click)="onBackdropClick($event)">
    <aside class="drawer" role="dialog" aria-modal="true" [attr.aria-label]="t('jsonld.dialogAria')">
      <header class="drawer-header">
        <div class="drawer-heading">
          <span class="gs-badge gs-badge--vocab">GS1 Web Vocabulary</span>
          <h2>{{ t('jsonld.heading') }}</h2>
          <p>JSON-LD</p>
        </div>
        <button type="button" class="drawer-close" (click)="close()" [attr.aria-label]="t('jsonld.closeAria')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </header>

      <div class="drawer-body">
        <div class="jsonld-toolbar">
          <span class="jsonld-path">application/ld+json</span>
          <button type="button" class="copy-btn" (click)="copy()">
            @if (copied()) {
              <span>{{ t('jsonld.copied') }}</span>
            } @else {
              <span>{{ t('jsonld.copyJson') }}</span>
            }
          </button>
        </div>
        <pre class="jsonld-code gs-code-block"><code [innerHTML]="highlightedJson()"></code></pre>
      </div>
    </aside>
  </div>
}
