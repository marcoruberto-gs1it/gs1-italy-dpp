<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="app-icon"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('droplet') {
      <path d="M12 2.7c-3.6 4.4-6 7.7-6 10.8a6 6 0 0 0 12 0c0-3.1-2.4-6.4-6-10.8z"></path>
    }
    @case ('zap') {
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
    }
    @case ('cloud') {
      <path d="M17.5 21H6.5a4.5 4.5 0 0 1-1-8.87A6 6 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 12.5z"></path>
    }
    @case ('flask') {
      <path d="M9 2v6L4 18a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3L15 8V2"></path>
      <path d="M9 2h6"></path>
      <path d="M6.5 15h11"></path>
    }
    @case ('refresh') {
      <path d="M23 4v6h-6"></path>
      <path d="M1 20v-6h6"></path>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
      <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    }
    @case ('shield-check') {
      <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"></path>
      <path d="M8.5 12l2.5 2.5L15.5 9.5"></path>
    }
    @case ('weight') {
      <circle cx="12" cy="5" r="3"></circle>
      <path d="M6.5 8h11l2 13H4.5z"></path>
    }
    @case ('ruler') {
      <rect x="2" y="8" width="20" height="8" rx="1"></rect>
      <path d="M6 8v3"></path>
      <path d="M10 8v3"></path>
      <path d="M14 8v3"></path>
      <path d="M18 8v3"></path>
    }
    @case ('layers') {
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    }
    @case ('tag') {
      <path d="M20.59 13.41L11 3.83V3H3v8h.83l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82z"></path>
      <circle cx="6.5" cy="6.5" r="1.5" fill="currentColor"></circle>
    }
    @case ('swatch') {
      <circle cx="12" cy="12" r="9"></circle>
      <circle cx="12" cy="12" r="3.2" fill="currentColor"></circle>
    }
    @case ('flame') {
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
    }
    @case ('box') {
      <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73V8z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    }
    @case ('building') {
      <rect x="4" y="3" width="16" height="18" rx="1"></rect>
      <path d="M9 21v-6h6v6"></path>
      <line x1="8" y1="7" x2="9" y2="7"></line>
      <line x1="15" y1="7" x2="16" y2="7"></line>
      <line x1="8" y1="11" x2="9" y2="11"></line>
      <line x1="15" y1="11" x2="16" y2="11"></line>
    }
    @case ('truck') {
      <rect x="1" y="6" width="14" height="10" rx="1"></rect>
      <path d="M15 10h4l3 3v3h-7z"></path>
      <circle cx="6" cy="18" r="2"></circle>
      <circle cx="17" cy="18" r="2"></circle>
    }
    @case ('map-pin') {
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
      <circle cx="12" cy="10" r="3"></circle>
    }
    @case ('flag') {
      <path d="M4 22V4a1 1 0 0 1 1-1h11l-2 5 2 5H6"></path>
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M8 12l3 3 5-6"></path>
    }
    @case ('wrench') {
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
    }
    @case ('hash') {
      <line x1="4" y1="9" x2="20" y2="9"></line>
      <line x1="4" y1="15" x2="20" y2="15"></line>
      <line x1="10" y1="3" x2="8" y2="21"></line>
      <line x1="16" y1="3" x2="14" y2="21"></line>
    }
    @case ('globe') {
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    }
    @case ('calendar') {
      <rect x="3" y="4" width="18" height="18" rx="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    }
    @case ('braces') {
      <path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1"></path>
      <path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"></path>
    }
    @case ('file-text') {
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <line x1="10" y1="9" x2="8" y2="9"></line>
    }
    @case ('send') {
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    }
    @case ('inbox') {
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
      <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
    }
    @default {
      <circle cx="12" cy="12" r="9"></circle>
    }
  }
</svg>
