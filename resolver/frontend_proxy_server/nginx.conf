# Adattato (non vendorizzato pari pari, a differenza di data_entry_server/web_server/
# database_server — vedi resolver/README.md) dal frontend_proxy_server originale di
# gs1/GS1_DigitalLink_Resolver_CE: stessa identica logica di instradamento (root → resolving
# web server con prefisso /api aggiunto, /api e /swaggerui → data entry server), ma con gli
# host a monte parametrizzati invece che scritti fissi ("web-service:4000", "data-entry-
# service:3000") — su Render questo servizio è l'unico raggiungibile pubblicamente, e i suoi
# "vicini" non hanno un nome DNS interno fisso come nella rete Docker locale, vedi
# docs/RESOLVER-SETUP.md.
#
# Template, non conf.d/default.conf diretto — stesso pattern di webshop/nginx.conf: l'immagine
# ufficiale nginx sostituisce da sola, all'avvio del container, ogni ${VAR} con la variabile
# d'ambiente realmente impostata.
server {
    listen 80;

    # Upstream su HTTPS (i due servizi Render hanno solo un URL pubblico https://, niente
    # indirizzo interno come nella rete Docker locale) — senza queste due righe l'handshake TLS
    # fallisce con "SSL alert number 40" (verificato dal vivo, non dedotto): Render instrada per
    # SNI, e nginx non manda SNI di default quando l'host a monte arriva da una variabile.
    # $proxy_host (l'host dedotto da proxy_pass, non $host = l'header Host della richiesta
    # ENTRANTE) per lo stesso motivo: l'upstream deve vedere il proprio hostname, non quello
    # pubblico di questo proxy.
    proxy_ssl_server_name on;

    location / {
        proxy_pass ${RESOLVER_WEB_UPSTREAM}/api/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 16k;
    }

    location /api {
        proxy_pass ${RESOLVER_DATA_ENTRY_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swaggerui {
        proxy_pass ${RESOLVER_DATA_ENTRY_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
