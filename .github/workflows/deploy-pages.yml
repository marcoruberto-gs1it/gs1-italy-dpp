name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy sovrapposti: un push mentre un deploy è in corso attende, non lo interrompe
# (i deploy verso l'ambiente "production" non vengono mai cancellati a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Solo il bundle client/prerenderizzato serve per GitHub Pages (hosting statico): il
      # bundle server SSR (Express) viene comunque generato dalla build ma non pubblicato.
      # --base-href è necessario perché il sito vive sotto un sottopercorso
      # (https://<utente>.github.io/<repo>/) e non alla radice del dominio. SITE_URL (stesso
      # sottopercorso, ma con dominio completo) è letto da generate-seo-files.js — nessun
      # dominio hardcoded nel codice, quindi un cambio di dominio/repo richiede di aggiornare
      # solo questo workflow.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # GitHub Pages serve i file staticamente: per le rotte client-rendered (lotto/seriale,
      # potenzialmente infinite, non prerenderizzabili — vedi app.routes.server.ts) qualunque
      # richiesta a un path senza un file corrispondente deve ricadere sulla stessa index.html,
      # cosicché l'Angular Router la gestisca lato client. GitHub Pages fa esattamente questo se
      # trova un 404.html nella root pubblicata.
      - run: cp dist/gs1-catalog/browser/index.html dist/gs1-catalog/browser/404.html

      # Impedisce a GitHub Pages di processare l'output con Jekyll (che ignorerebbe/alterebbe
      # file e cartelle il cui nome inizia con "_", potenzialmente presenti nei chunk generati).
      - run: touch dist/gs1-catalog/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gs1-catalog/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
